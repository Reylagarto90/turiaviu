<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuriaViu · AFEMPES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --verde-bosque:#1B4D3E;
    --verde-bosque-dark:#0F332A;
    --salvia:#A9C4B8;
    --salvia-light:#E7EFEA;
    --rosa:#D98CA0;
    --rosa-dark:#B15D75;
    --fondo:#FAF9F6;
    --texto:#233129;
    --texto-suave:#5B6B62;
    --borde:#DDE4DF;
    --blanco:#FFFFFF;
    --radio:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fondo); color:var(--texto);
  }
  a{color:inherit;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:28px;
  }
  #login-screen img.logo-afempes{ height:120px; }
  .login-card{
    background:var(--blanco); border:1px solid var(--borde); border-radius:16px;
    padding:36px 32px; width:100%; max-width:380px; box-shadow:0 2px 16px rgba(27,77,62,0.06);
  }
  .login-card h1{ font-size:20px; margin:0 0 6px; color:var(--verde-bosque-dark); font-weight:600;}
  .login-card p.sub{ margin:0 0 24px; font-size:13px; color:var(--texto-suave); }
  .login-card label{ display:block; font-size:13px; margin-bottom:6px; color:var(--texto-suave); }
  .login-card input{
    width:100%; padding:10px 12px; margin-bottom:16px; border:1px solid var(--borde);
    border-radius:8px; font-size:14px;
  }
  .login-card input:focus{ outline:2px solid var(--salvia); border-color:var(--verde-bosque); }
  .btn-primary{
    width:100%; background:var(--verde-bosque); color:var(--blanco); border:none;
    padding:11px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-primary:hover{ background:var(--verde-bosque-dark); }
  .btn-secundario{
    background:var(--blanco); color:var(--verde-bosque); border:1px solid var(--verde-bosque);
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .btn-secundario:hover{ background:var(--salvia-light); }
  .btn-secundario:disabled{ opacity:0.6; cursor:default; }
  #login-error{ color:var(--rosa-dark); font-size:13px; margin-top:10px; min-height:16px; }
  .banda-institucional{ max-width:420px; width:100%; }
  .banda-institucional img{ width:100%; display:block; border-radius:6px; }

  /* ---------- APP SHELL ---------- */
  #app{ display:none; min-height:100vh; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; background:var(--blanco); border-bottom:1px solid var(--borde);
    position:sticky; top:0; z-index:10;
  }
  header .marca{ display:flex; align-items:center; gap:12px; }
  header img.logo-afempes-header{ height:36px; }
  header .titulo-proyecto{ font-size:14px; font-weight:600; color:var(--verde-bosque-dark); }
  header .titulo-proyecto span{ display:block; font-weight:400; font-size:11px; color:var(--texto-suave); }
  header img.banda-header{ height:34px; }
  header .usuario{ display:flex; align-items:center; gap:10px; font-size:13px; }
  header button.link{ background:none; border:none; color:var(--texto-suave); cursor:pointer; font-size:13px; text-decoration:underline; }

  .layout{ display:flex; }
  nav.sidebar{
    width:230px; flex-shrink:0; background:var(--verde-bosque-dark); min-height:calc(100vh - 57px);
    padding:16px 10px;
  }
  nav.sidebar .modulo{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    color:#D9E6DF; font-size:13px; cursor:pointer; margin-bottom:2px;
  }
  nav.sidebar .modulo:hover{ background:rgba(255,255,255,0.06); }
  nav.sidebar .modulo.activo{ background:var(--salvia); color:var(--verde-bosque-dark); font-weight:600; }
  nav.sidebar .modulo .badge-proximamente{
    margin-left:auto; font-size:10px; background:rgba(255,255,255,0.12); padding:2px 6px; border-radius:6px;
    color:#B9C9C1;
  }
  main{ flex:1; padding:28px 32px; }
  main h2{ margin:0 0 4px; color:var(--verde-bosque-dark); font-size:20px; }
  main p.section-sub{ margin:0 0 24px; color:var(--texto-suave); font-size:13px; }

  .card{ background:var(--blanco); border:1px solid var(--borde); border-radius:var(--radio); padding:20px; margin-bottom:16px; }
  .objetivo-card .oe-codigo{
    display:inline-block; background:var(--salvia-light); color:var(--verde-bosque-dark);
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; margin-bottom:8px;
  }
  .objetivo-card .oe-desc{ font-size:13px; color:var(--texto); margin:0 0 14px; line-height:1.5; }
  .indicador-row{ margin-bottom:12px; }
  .indicador-row .ind-label{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; color:var(--texto-suave); }
  .barra-bg{ background:var(--salvia-light); border-radius:6px; height:8px; overflow:hidden; }
  .barra-fill{ background:var(--verde-bosque); height:100%; border-radius:6px; transition:width .4s; }
  .barra-fill.rosa{ background:var(--rosa-dark); }

  .placeholder-modulo{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 20px; color:var(--texto-suave); text-align:center; border:1px dashed var(--borde); border-radius:var(--radio);
  }
  .placeholder-modulo strong{ color:var(--verde-bosque-dark); font-size:15px; margin-bottom:6px; }

  /* ---------- MÓDULO COMITÉ ---------- */
  .tabs-comite{ display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--borde); }
  .tab-comite{
    background:none; border:none; padding:9px 14px; font-size:13px; color:var(--texto-suave);
    cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab-comite.activa{ color:var(--verde-bosque-dark); font-weight:600; border-bottom-color:var(--verde-bosque); }
  .titulo-card{ margin:0 0 12px; font-size:14px; color:var(--verde-bosque-dark); }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-bottom:10px; }
  .form-grid input, .form-grid select, .textarea-comite{
    padding:8px 10px; border:1px solid var(--borde); border-radius:8px; font-size:13px; width:100%;
    font-family:inherit;
  }
  .textarea-comite{ display:block; min-height:60px; margin-bottom:10px; resize:vertical; }
  .btn-inline{ width:auto; padding:8px 18px; display:inline-block; }
  .checks-asistentes{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
  .check-asistente{ font-size:13px; display:flex; align-items:center; gap:6px; color:var(--texto-suave); }
  .fila-miembro{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .badge-rol{
    font-size:11px; background:var(--rosa); color:var(--verde-bosque-dark); padding:2px 7px;
    border-radius:6px; margin-left:6px; text-transform:capitalize;
  }
  .select-estado{ padding:6px 10px; border-radius:8px; border:1px solid var(--borde); font-size:12px; }
  .select-estado.estado-pendiente{ background:var(--salvia-light); }
  .select-estado.estado-en_curso{ background:#FCEFD9; }
  .select-estado.estado-cerrado{ background:var(--salvia); }
</style>
</head>
<body>

<!-- ============================================================= -->
<!-- LOGIN                                                          -->
<!-- ============================================================= -->
<div id="login-screen">
  <img class="logo-afempes" src="assets/logo_afempes.png" alt="AFEMPES Salud Mental">
  <div class="login-card">
    <h1>TuriaViu</h1>
    <p class="sub">Herramienta interna de gestión del proyecto</p>
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="nombre@afempes.org">
    <label for="password">Contraseña</label>
    <input type="password" id="password">
    <button class="btn-primary" onclick="iniciarSesion()">Entrar</button>
    <div id="login-error"></div>
  </div>
  <div class="banda-institucional">
    <img src="assets/banda_institucional.jpg" alt="Ministerio para la Transición Ecológica y el Reto Demográfico · Fundación Biodiversidad">
  </div>
</div>

<!-- ============================================================= -->
<!-- APP                                                            -->
<!-- ============================================================= -->
<div id="app">
  <header>
    <div class="marca">
      <img class="logo-afempes-header" src="assets/logo_afempes.png" alt="AFEMPES">
      <div class="titulo-proyecto">TuriaViu<span>Brigada de restauración ecológica · Parque Natural del Turia</span></div>
    </div>
    <img class="banda-header" src="assets/banda_institucional.jpg" alt="Fundación Biodiversidad">
    <div class="usuario">
      <span id="usuario-email"></span>
      <button class="link" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main-content"></main>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACIÓN SUPABASE — sustituir por el proyecto real (región EU)
// =====================================================================
const SUPABASE_URL = 'https://aefcbhghdoflizhdelgo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__zHVO4OY1hxtnM6TXdFpwg_e6ubQG_E';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =====================================================================
// MÓDULOS (11 definidos en el esqueleto acordado)
// Sprint 1 activo: nucleo. El resto entran en sprints siguientes.
// =====================================================================
const MODULOS = [
  { id:'nucleo',        nombre:'Objetivos e indicadores', sprint:1, activo:true  },
  { id:'cronograma',    nombre:'Cronograma',               sprint:1, activo:false },
  { id:'rrhh',          nombre:'RRHH',                     sprint:2, activo:false },
  { id:'brigadistas',   nombre:'Brigadistas',              sprint:2, activo:false },
  { id:'vivero_campo',  nombre:'Vivero y campo',           sprint:3, activo:false },
  { id:'bitacora',      nombre:'Cuaderno de bitácora',     sprint:3, activo:false },
  { id:'incidencias',   nombre:'Incidencias',              sprint:1, activo:false },
  { id:'actas',         nombre:'Actas de trabajo',         sprint:1, activo:false },
  { id:'comunicacion',  nombre:'Comunicación',              sprint:4, activo:false },
  { id:'presupuesto',   nombre:'Presupuesto',              sprint:4, activo:false },
  { id:'comite',        nombre:'Comité e informes',        sprint:4, activo:true  },
];

let moduloActual = 'nucleo';

async function iniciarSesion(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errorEl.textContent = 'Error de Supabase: ' + error.message; return; }
  mostrarApp(data.user);
}

async function cerrarSesion(){
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function mostrarApp(user){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('usuario-email').textContent = user?.email ?? '';
  renderSidebar();
  cargarModulo(moduloActual);
}

function renderSidebar(){
  const nav = document.getElementById('sidebar');
  nav.innerHTML = MODULOS.map(m => `
    <div class="modulo ${m.id === moduloActual ? 'activo' : ''}" onclick="cargarModulo('${m.id}')">
      ${m.nombre}
      ${!m.activo ? `<span class="badge-proximamente">Sprint ${m.sprint}</span>` : ''}
    </div>
  `).join('');
}

async function cargarModulo(id){
  moduloActual = id;
  renderSidebar();
  const main = document.getElementById('main-content');
  const modulo = MODULOS.find(m => m.id === id);

  if (!modulo.activo){
    main.innerHTML = `
      <h2>${modulo.nombre}</h2>
      <div class="placeholder-modulo">
        <strong>Módulo en construcción</strong>
        Este módulo llega en el Sprint ${modulo.sprint} del plan de trabajo.
      </div>`;
    return;
  }

  if (id === 'nucleo'){
    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
        <div>
          <h2>Objetivos e indicadores</h2>
          <p class="section-sub">Meta vs. valor real de cada objetivo específico</p>
        </div>
        <button class="btn-secundario" id="btn-recargar-excel" onclick="recargarDesdeExcel()">Recargar desde el Excel</button>
      </div>
      <div id="recarga-msg" class="section-sub"></div>
      <div id="lista-objetivos"><p class="section-sub">Cargando...</p></div>`;
    await cargarObjetivosEIndicadores();
  }

  if (id === 'comite'){
    main.innerHTML = `
      <h2>Comité e informes</h2>
      <p class="section-sub">Comité Técnico-Científico Asesor: miembros, actas y seguimiento</p>
      <div class="tabs-comite">
        <button class="tab-comite activa" data-tab="miembros" onclick="cambiarTabComite('miembros')">Miembros</button>
        <button class="tab-comite" data-tab="actas" onclick="cambiarTabComite('actas')">Actas</button>
        <button class="tab-comite" data-tab="seguimiento" onclick="cambiarTabComite('seguimiento')">Seguimiento</button>
      </div>
      <div id="contenido-comite"><p class="section-sub">Cargando...</p></div>`;
    await cambiarTabComite('miembros');
  }
}

async function recargarDesdeExcel(){
  const ok = confirm('Esto borra los objetivos, indicadores, actividades y acciones actuales y los vuelve a cargar tal como están en el Excel M8. ¿Continuar?');
  if (!ok) return;
  const btn = document.getElementById('btn-recargar-excel');
  const msg = document.getElementById('recarga-msg');
  btn.disabled = true; btn.textContent = 'Recargando...';
  msg.textContent = '';
  const { error } = await sb.rpc('cargar_seed_nucleo');
  btn.disabled = false; btn.textContent = 'Recargar desde el Excel';
  if (error){
    msg.innerHTML = `<span style="color:var(--rosa-dark)">No se ha podido recargar: ${error.message}</span>`;
    return;
  }
  msg.innerHTML = `<span style="color:var(--verde-bosque)">Datos recargados correctamente desde el Excel.</span>`;
  await cargarObjetivosEIndicadores();
}

async function cargarObjetivosEIndicadores(){
  const cont = document.getElementById('lista-objetivos');
  const { data: objetivos, error: errObj } = await sb
    .from('objetivos')
    .select('id, codigo, descripcion, indicadores(id, codigo, descripcion, unidad_medida, meta, valor_actual)')
    .order('codigo');

  if (errObj){
    cont.innerHTML = `<p class="section-sub">No se han podido cargar los objetivos. Comprueba la conexión con Supabase (URL/clave en la configuración) y las políticas RLS.</p>`;
    return;
  }
  if (!objetivos || objetivos.length === 0){
    cont.innerHTML = `<p class="section-sub">Todavía no hay objetivos cargados. Ejecuta el script schema_sprint1.sql y añade los OE1-OE5 del Marco Lógico.</p>`;
    return;
  }

  cont.innerHTML = objetivos.map(oe => `
    <div class="card objetivo-card">
      <span class="oe-codigo">${oe.codigo}</span>
      <p class="oe-desc">${oe.descripcion}</p>
      ${(oe.indicadores || []).map(ind => {
        const pct = ind.meta ? Math.min(100, Math.round((ind.valor_actual / ind.meta) * 100)) : 0;
        return `
        <div class="indicador-row">
          <div class="ind-label"><span>${ind.codigo} — ${ind.descripcion}</span><span>${ind.valor_actual} / ${ind.meta ?? '—'} ${ind.unidad_medida ?? ''}</span></div>
          <div class="barra-bg"><div class="barra-fill ${pct < 50 ? 'rosa' : ''}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

// =====================================================================
// MÓDULO: COMITÉ E INFORMES
// =====================================================================
let tabComiteActual = 'miembros';

async function cambiarTabComite(tab){
  tabComiteActual = tab;
  document.querySelectorAll('.tab-comite').forEach(b => b.classList.toggle('activa', b.dataset.tab === tab));
  const cont = document.getElementById('contenido-comite');
  cont.innerHTML = '<p class="section-sub">Cargando...</p>';
  if (tab === 'miembros') await renderMiembrosComite(cont);
  if (tab === 'actas') await renderActasComite(cont);
  if (tab === 'seguimiento') await renderSeguimientoComite(cont);
}

// --------- MIEMBROS ---------
async function renderMiembrosComite(cont){
  const { data: miembros, error } = await sb.from('comite_miembros').select('*').order('created_at');
  if (error){ cont.innerHTML = `<p class="section-sub">No se han podido cargar los miembros: ${error.message}</p>`; return; }

  cont.innerHTML = `
    <div class="card">
      <h3 class="titulo-card">Añadir miembro</h3>
      <div class="form-grid">
        <input id="nm-nombre" placeholder="Nombre y apellidos">
        <input id="nm-entidad" placeholder="Entidad a la que representa">
        <input id="nm-perfil" placeholder="Perfil / cargo">
        <select id="nm-rol">
          <option value="vocal">Vocal</option>
          <option value="presidencia">Presidencia</option>
          <option value="secretaria">Secretaría</option>
        </select>
        <input id="nm-fecha-alta" type="date" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <button class="btn-primary btn-inline" onclick="crearMiembroComite()">Añadir</button>
      <div id="miembro-msg" class="section-sub"></div>
    </div>
    <div id="lista-miembros">
      ${miembros.length === 0 ? '<p class="section-sub">Todavía no hay miembros registrados.</p>' : miembros.map(m => `
        <div class="card fila-miembro">
          <div>
            <strong>${m.nombre}</strong> <span class="badge-rol">${m.rol}</span>
            <p class="section-sub" style="margin:2px 0 0">${m.perfil ?? ''}${m.entidad ? ' · ' + m.entidad : ''}</p>
            <p class="section-sub" style="margin:2px 0 0">Alta: ${m.fecha_alta}${m.fecha_baja ? ' · Baja: ' + m.fecha_baja : ''}</p>
          </div>
          <div>
            ${m.activo
              ? `<button class="btn-secundario" onclick="darBajaMiembro('${m.id}')">Dar de baja</button>`
              : `<span class="badge-proximamente">Inactivo</span>`}
          </div>
        </div>
      `).join('')}
    </div>`;
}

async function crearMiembroComite(){
  const nombre = document.getElementById('nm-nombre').value.trim();
  const msg = document.getElementById('miembro-msg');
  if (!nombre){ msg.textContent = 'El nombre es obligatorio.'; return; }
  const { data: proyecto } = await sb.from('proyecto').select('id').limit(1).single();
  const { error } = await sb.from('comite_miembros').insert({
    proyecto_id: proyecto.id,
    nombre,
    entidad: document.getElementById('nm-entidad').value.trim() || null,
    perfil: document.getElementById('nm-perfil').value.trim() || null,
    rol: document.getElementById('nm-rol').value,
    fecha_alta: document.getElementById('nm-fecha-alta').value,
  });
  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }
  await renderMiembrosComite(document.getElementById('contenido-comite'));
}

async function darBajaMiembro(id){
  const ok = confirm('¿Marcar a este miembro como inactivo (baja)?');
  if (!ok) return;
  await sb.from('comite_miembros').update({ activo:false, fecha_baja: new Date().toISOString().slice(0,10) }).eq('id', id);
  await renderMiembrosComite(document.getElementById('contenido-comite'));
}

// --------- ACTAS ---------
async function renderActasComite(cont){
  const { data: actas, error } = await sb
    .from('actas_comite')
    .select('*, acta_comite_asistentes(miembro_id, comite_miembros(nombre))')
    .order('fecha', { ascending:false });
  const { data: miembros } = await sb.from('comite_miembros').select('id, nombre').eq('activo', true);

  if (error){ cont.innerHTML = `<p class="section-sub">No se han podido cargar las actas: ${error.message}</p>`; return; }

  cont.innerHTML = `
    <div class="card">
      <h3 class="titulo-card">Nueva acta</h3>
      <div class="form-grid">
        <input id="na-fecha" type="date" value="${new Date().toISOString().slice(0,10)}">
        <select id="na-tipo">
          <option value="constitucion">Constitución</option>
          <option value="seguimiento_semestral" selected>Seguimiento semestral</option>
          <option value="extraordinaria">Extraordinaria</option>
        </select>
        <input id="na-documento" placeholder="Enlace al documento firmado (opcional)">
      </div>
      <textarea id="na-orden" placeholder="Orden del día" class="textarea-comite"></textarea>
      <textarea id="na-acuerdos" placeholder="Acuerdos" class="textarea-comite"></textarea>
      <p class="section-sub" style="margin:10px 0 4px">Asistentes:</p>
      <div class="checks-asistentes">
        ${(miembros || []).map(m => `
          <label class="check-asistente"><input type="checkbox" value="${m.id}" class="chk-asistente-nueva"> ${m.nombre}</label>
        `).join('') || '<span class="section-sub">Añade miembros primero en la pestaña Miembros.</span>'}
      </div>
      <button class="btn-primary btn-inline" onclick="crearActaComite()">Guardar acta</button>
      <div id="acta-msg" class="section-sub"></div>
    </div>
    <div>
      ${(!actas || actas.length === 0) ? '<p class="section-sub">Todavía no hay actas registradas.</p>' : actas.map(a => `
        <div class="card">
          <span class="oe-codigo">${a.tipo.replace('_',' ')}</span>
          <p class="section-sub" style="margin:6px 0">${a.fecha}${a.documento_url ? ` · <a href="${a.documento_url}" target="_blank">documento</a>` : ''}</p>
          ${a.orden_dia ? `<p style="font-size:13px;"><strong>Orden del día:</strong> ${a.orden_dia}</p>` : ''}
          ${a.acuerdos ? `<p style="font-size:13px;"><strong>Acuerdos:</strong> ${a.acuerdos}</p>` : ''}
          <p class="section-sub">Asistentes: ${(a.acta_comite_asistentes || []).map(x => x.comite_miembros?.nombre).filter(Boolean).join(', ') || '—'}</p>
        </div>
      `).join('')}
    </div>`;
}

async function crearActaComite(){
  const msg = document.getElementById('acta-msg');
  const { data: proyecto } = await sb.from('proyecto').select('id').limit(1).single();
  const asistentesIds = Array.from(document.querySelectorAll('.chk-asistente-nueva:checked')).map(c => c.value);

  const { data: acta, error } = await sb.from('actas_comite').insert({
    proyecto_id: proyecto.id,
    fecha: document.getElementById('na-fecha').value,
    tipo: document.getElementById('na-tipo').value,
    orden_dia: document.getElementById('na-orden').value.trim() || null,
    acuerdos: document.getElementById('na-acuerdos').value.trim() || null,
    documento_url: document.getElementById('na-documento').value.trim() || null,
  }).select().single();

  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }

  if (asistentesIds.length > 0){
    const filas = asistentesIds.map(mid => ({ acta_id: acta.id, miembro_id: mid }));
    await sb.from('acta_comite_asistentes').insert(filas);
  }

  await renderActasComite(document.getElementById('contenido-comite'));
}

// --------- SEGUIMIENTO (compromisos del comité) ---------
async function renderSeguimientoComite(cont){
  const { data: compromisos, error } = await sb
    .from('compromisos_comite')
    .select('*, actas_comite(fecha, tipo), comite_miembros(nombre)')
    .order('fecha_limite', { ascending:true, nullsFirst:false });
  const { data: actas } = await sb.from('actas_comite').select('id, fecha, tipo').order('fecha', { ascending:false });
  const { data: miembros } = await sb.from('comite_miembros').select('id, nombre').eq('activo', true);

  if (error){ cont.innerHTML = `<p class="section-sub">No se han podido cargar los compromisos: ${error.message}</p>`; return; }

  cont.innerHTML = `
    <div class="card">
      <h3 class="titulo-card">Nuevo compromiso</h3>
      <div class="form-grid">
        <select id="ns-acta">
          ${(actas || []).map(a => `<option value="${a.id}">${a.fecha} · ${a.tipo.replace('_',' ')}</option>`).join('') || '<option value="">Crea un acta primero</option>'}
        </select>
        <select id="ns-responsable">
          <option value="">Responsable externo (escribir abajo)</option>
          ${(miembros || []).map(m => `<option value="${m.id}">${m.nombre}</option>`).join('')}
        </select>
        <input id="ns-responsable-nombre" placeholder="Nombre del responsable (si no está en la lista)">
        <input id="ns-fecha-limite" type="date">
      </div>
      <textarea id="ns-descripcion" placeholder="Descripción del compromiso" class="textarea-comite"></textarea>
      <button class="btn-primary btn-inline" onclick="crearCompromisoComite()">Añadir compromiso</button>
      <div id="compromiso-msg" class="section-sub"></div>
    </div>
    <div>
      ${(!compromisos || compromisos.length === 0) ? '<p class="section-sub">Todavía no hay compromisos registrados.</p>' : compromisos.map(c => `
        <div class="card fila-miembro">
          <div>
            <p style="font-size:13px; margin:0 0 4px;">${c.descripcion}</p>
            <p class="section-sub" style="margin:0;">Responsable: ${c.comite_miembros?.nombre ?? c.responsable_nombre ?? '—'} · Límite: ${c.fecha_limite ?? '—'}</p>
            <p class="section-sub" style="margin:0;">Acta: ${c.actas_comite ? c.actas_comite.fecha + ' · ' + c.actas_comite.tipo.replace('_',' ') : '—'}</p>
          </div>
          <div>
            <select onchange="cambiarEstadoCompromiso('${c.id}', this.value)" class="select-estado estado-${c.estado}">
              <option value="pendiente" ${c.estado==='pendiente'?'selected':''}>Pendiente</option>
              <option value="en_curso" ${c.estado==='en_curso'?'selected':''}>En curso</option>
              <option value="cerrado" ${c.estado==='cerrado'?'selected':''}>Cerrado</option>
            </select>
          </div>
        </div>
      `).join('')}
    </div>`;
}

async function crearCompromisoComite(){
  const msg = document.getElementById('compromiso-msg');
  const actaId = document.getElementById('ns-acta').value;
  const descripcion = document.getElementById('ns-descripcion').value.trim();
  if (!actaId || !descripcion){ msg.textContent = 'Selecciona un acta y describe el compromiso.'; return; }

  const { error } = await sb.from('compromisos_comite').insert({
    acta_id: actaId,
    descripcion,
    responsable_id: document.getElementById('ns-responsable').value || null,
    responsable_nombre: document.getElementById('ns-responsable-nombre').value.trim() || null,
    fecha_limite: document.getElementById('ns-fecha-limite').value || null,
  });
  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }
  await renderSeguimientoComite(document.getElementById('contenido-comite'));
}

async function cambiarEstadoCompromiso(id, estado){
  await sb.from('compromisos_comite').update({ estado }).eq('id', id);
  await renderSeguimientoComite(document.getElementById('contenido-comite'));
}

// Comprobar sesión activa al cargar
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) mostrarApp(session.user);
})();
</script>
