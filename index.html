<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuriaViu · AFEMPES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --verde-bosque:#1B4D3E;
    --verde-bosque-dark:#0F332A;
    --salvia:#A9C4B8;
    --salvia-light:#E7EFEA;
    --rosa:#D98CA0;
    --rosa-dark:#B15D75;
    --fondo:#FAF9F6;
    --texto:#233129;
    --texto-suave:#5B6B62;
    --borde:#DDE4DF;
    --blanco:#FFFFFF;
    --radio:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fondo); color:var(--texto);
  }
  a{color:inherit;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:28px;
  }
  #login-screen img.logo-afempes{ height:120px; }
  .login-card{
    background:var(--blanco); border:1px solid var(--borde); border-radius:16px;
    padding:36px 32px; width:100%; max-width:380px; box-shadow:0 2px 16px rgba(27,77,62,0.06);
  }
  .login-card h1{ font-size:20px; margin:0 0 6px; color:var(--verde-bosque-dark); font-weight:600;}
  .login-card p.sub{ margin:0 0 24px; font-size:13px; color:var(--texto-suave); }
  .login-card label{ display:block; font-size:13px; margin-bottom:6px; color:var(--texto-suave); }
  .login-card input{
    width:100%; padding:10px 12px; margin-bottom:16px; border:1px solid var(--borde);
    border-radius:8px; font-size:14px;
  }
  .login-card input:focus{ outline:2px solid var(--salvia); border-color:var(--verde-bosque); }
  .btn-primary{
    width:100%; background:var(--verde-bosque); color:var(--blanco); border:none;
    padding:11px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-primary:hover{ background:var(--verde-bosque-dark); }
  .btn-secundario{
    background:var(--blanco); color:var(--verde-bosque); border:1px solid var(--verde-bosque);
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .btn-secundario:hover{ background:var(--salvia-light); }
  .btn-secundario:disabled{ opacity:0.6; cursor:default; }
  #login-error{ color:var(--rosa-dark); font-size:13px; margin-top:10px; min-height:16px; }
  .banda-institucional{ max-width:420px; width:100%; }
  .banda-institucional img{ width:100%; display:block; border-radius:6px; }

  /* ---------- APP SHELL ---------- */
  #app{ display:none; min-height:100vh; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; background:var(--blanco); border-bottom:1px solid var(--borde);
    position:sticky; top:0; z-index:10;
  }
  header .marca{ display:flex; align-items:center; gap:12px; }
  header img.logo-afempes-header{ height:36px; }
  header .titulo-proyecto{ font-size:14px; font-weight:600; color:var(--verde-bosque-dark); }
  header .titulo-proyecto span{ display:block; font-weight:400; font-size:11px; color:var(--texto-suave); }
  header img.banda-header{ height:34px; }
  header .usuario{ display:flex; align-items:center; gap:10px; font-size:13px; }
  header button.link{ background:none; border:none; color:var(--texto-suave); cursor:pointer; font-size:13px; text-decoration:underline; }

  .layout{ display:flex; }
  nav.sidebar{
    width:230px; flex-shrink:0; background:var(--verde-bosque-dark); min-height:calc(100vh - 57px);
    padding:16px 10px;
  }
  nav.sidebar .modulo{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    color:#D9E6DF; font-size:13px; cursor:pointer; margin-bottom:2px;
  }
  nav.sidebar .modulo:hover{ background:rgba(255,255,255,0.06); }
  nav.sidebar .modulo.activo{ background:var(--salvia); color:var(--verde-bosque-dark); font-weight:600; }
  nav.sidebar .modulo .badge-proximamente{
    margin-left:auto; font-size:10px; background:rgba(255,255,255,0.12); padding:2px 6px; border-radius:6px;
    color:#B9C9C1;
  }
  main{ flex:1; padding:28px 32px; }
  main h2{ margin:0 0 4px; color:var(--verde-bosque-dark); font-size:20px; }
  main p.section-sub{ margin:0 0 24px; color:var(--texto-suave); font-size:13px; }

  .card{ background:var(--blanco); border:1px solid var(--borde); border-radius:var(--radio); padding:20px; margin-bottom:16px; }
  .objetivo-card .oe-codigo{
    display:inline-block; background:var(--salvia-light); color:var(--verde-bosque-dark);
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; margin-bottom:8px;
  }
  .objetivo-card .oe-desc{ font-size:13px; color:var(--texto); margin:0 0 14px; line-height:1.5; }
  .indicador-row{ margin-bottom:12px; }
  .indicador-row .ind-label{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; color:var(--texto-suave); }
  .barra-bg{ background:var(--salvia-light); border-radius:6px; height:8px; overflow:hidden; }
  .barra-fill{ background:var(--verde-bosque); height:100%; border-radius:6px; transition:width .4s; }
  .barra-fill.rosa{ background:var(--rosa-dark); }

  .placeholder-modulo{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 20px; color:var(--texto-suave); text-align:center; border:1px dashed var(--borde); border-radius:var(--radio);
  }
  .placeholder-modulo strong{ color:var(--verde-bosque-dark); font-size:15px; margin-bottom:6px; }

  /* ---------- MÓDULO COMITÉ ---------- */
  .tabs-comite{ display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--borde); }
  .tab-comite{
    background:none; border:none; padding:9px 14px; font-size:13px; color:var(--texto-suave);
    cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab-comite.activa{ color:var(--verde-bosque-dark); font-weight:600; border-bottom-color:var(--verde-bosque); }
  .titulo-card{ margin:0 0 12px; font-size:14px; color:var(--verde-bosque-dark); }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-bottom:10px; }
  .form-grid input, .form-grid select, .textarea-comite{
    padding:8px 10px; border:1px solid var(--borde); border-radius:8px; font-size:13px; width:100%;
    font-family:inherit;
  }
  .textarea-comite{ display:block; min-height:60px; margin-bottom:10px; resize:vertical; }
  .btn-inline{ width:auto; padding:8px 18px; display:inline-block; }
  .checks-asistentes{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
  .check-asistente{ font-size:13px; display:flex; align-items:center; gap:6px; color:var(--texto-suave); }
  .fila-miembro{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .badge-rol{
    font-size:11px; background:var(--rosa); color:var(--verde-bosque-dark); padding:2px 7px;
    border-radius:6px; margin-left:6px; text-transform:capitalize;
  }
  .select-estado{ padding:6px 10px; border-radius:8px; border:1px solid var(--borde); font-size:12px; }
  .select-estado.estado-pendiente{ background:var(--salvia-light); }
  .select-estado.estado-en_curso{ background:#FCEFD9; }
  .select-estado.estado-cerrado{ background:var(--salvia); }

  /* ---------- MODAL ---------- */
  #modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(15,51,42,0.45);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  #modal-overlay.abierto{ display:flex; }
  #modal-box{
    background:var(--blanco); border-radius:14px; padding:24px; width:100%; max-width:520px;
    max-height:85vh; overflow-y:auto; box-shadow:0 8px 30px rgba(15,51,42,0.2);
  }
  #modal-box h3{ margin:0 0 14px; color:var(--verde-bosque-dark); font-size:16px; }
  #modal-box .modal-cerrar{
    float:right; background:none; border:none; font-size:18px; color:var(--texto-suave); cursor:pointer; line-height:1;
  }
  .btn-anadir{
    background:var(--verde-bosque); color:var(--blanco); border:none; padding:8px 16px;
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:16px;
  }
  .btn-anadir:hover{ background:var(--verde-bosque-dark); }

  /* ---------- MÓDULO CRONOGRAMA ---------- */
  .lista-acciones-cronograma{ margin-top:12px; border-top:1px solid var(--borde); padding-top:10px; }
  .fila-accion-cronograma{
    display:flex; justify-content:space-between; align-items:center; padding:6px 0;
    border-bottom:1px dashed var(--borde);
  }
  .fila-accion-cronograma:last-child{ border-bottom:none; }
  .gantt-leyenda{ display:flex; gap:16px; margin-bottom:14px; font-size:12px; color:var(--texto-suave); }
  .gantt-leyenda i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  .gantt-scroll{ overflow-x:auto; border:1px solid var(--borde); border-radius:10px; background:var(--blanco); }
  .gantt-fila{ display:flex; align-items:center; min-width:900px; border-bottom:1px solid var(--borde); }
  .gantt-fila:last-child{ border-bottom:none; }
  .gantt-cabecera{ background:var(--salvia-light); font-weight:600; }
  .gantt-etiqueta{ width:220px; flex-shrink:0; font-size:12px; padding:6px 10px; color:var(--texto); }
  .gantt-fila-accion .gantt-etiqueta{ color:var(--texto-suave); font-size:11.5px; }
  .gantt-pista{ display:grid; flex:1; height:30px; position:relative; }
  .gantt-mes{ font-size:10.5px; text-align:center; color:var(--texto-suave); padding:6px 0; border-left:1px solid var(--borde); }
  .gantt-barra{ height:16px; margin-top:7px; border-radius:5px; }
  .gantt-barra-fina{ height:10px; margin-top:10px; opacity:0.85; }
  .registro-seguimiento{ padding:10px 0; border-bottom:1px solid var(--borde); }
  .registro-seguimiento:last-child{ border-bottom:none; }
  .btn-mini{ padding:5px 10px; font-size:12px; }
  .form-convertir-incidencia{ background:var(--fondo); border-radius:8px; padding:10px; margin-top:8px; }
</style>
</head>
<body>

<!-- ============================================================= -->
<!-- MODAL GENÉRICO (compartido por los formularios de alta)        -->
<!-- ============================================================= -->
<div id="modal-overlay" onclick="if(event.target === this) cerrarModal()">
  <div id="modal-box">
    <button class="modal-cerrar" onclick="cerrarModal()">&times;</button>
    <h3 id="modal-titulo"></h3>
    <div id="modal-cuerpo"></div>
  </div>
</div>


<!-- ============================================================= -->
<!-- LOGIN                                                          -->
<!-- ============================================================= -->
<div id="login-screen">
  <img class="logo-afempes" src="assets/logo_afempes.png" alt="AFEMPES Salud Mental">
  <div class="login-card">
    <h1>TuriaViu</h1>
    <p class="sub">Herramienta interna de gestión del proyecto</p>
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="nombre@afempes.org">
    <label for="password">Contraseña</label>
    <input type="password" id="password">
    <button class="btn-primary" onclick="iniciarSesion()">Entrar</button>
    <div id="login-error"></div>
  </div>
  <div class="banda-institucional">
    <img src="assets/banda_institucional.jpg" alt="Ministerio para la Transición Ecológica y el Reto Demográfico · Fundación Biodiversidad">
  </div>
</div>

<!-- ============================================================= -->
<!-- APP                                                            -->
<!-- ============================================================= -->
<div id="app">
  <header>
    <div class="marca">
      <img class="logo-afempes-header" src="assets/logo_afempes.png" alt="AFEMPES">
      <div class="titulo-proyecto">TuriaViu<span>Brigada de restauración ecológica · Parque Natural del Turia</span></div>
    </div>
    <img class="banda-header" src="assets/banda_institucional.jpg" alt="Fundación Biodiversidad">
    <div class="usuario">
      <span id="usuario-email"></span>
      <button class="link" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main-content"></main>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACIÓN SUPABASE — sustituir por el proyecto real (región EU)
// =====================================================================
const SUPABASE_URL = 'https://aefcbhghdoflizhdelgo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__zHVO4OY1hxtnM6TXdFpwg_e6ubQG_E';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =====================================================================
// MÓDULOS (11 definidos en el esqueleto acordado)
// Sprint 1 activo: nucleo. El resto entran en sprints siguientes.
// =====================================================================
const MODULOS = [
  { id:'nucleo',        nombre:'Objetivos e indicadores', sprint:1, activo:true  },
  { id:'cronograma',    nombre:'Cronograma',               sprint:1, activo:true  },
  { id:'rrhh',          nombre:'RRHH',                     sprint:2, activo:false },
  { id:'brigadistas',   nombre:'Brigadistas',              sprint:2, activo:false },
  { id:'vivero_campo',  nombre:'Vivero y campo',           sprint:3, activo:false },
  { id:'bitacora',      nombre:'Cuaderno de bitácora',     sprint:3, activo:false },
  { id:'incidencias',   nombre:'Incidencias',              sprint:1, activo:false },
  { id:'actas',         nombre:'Actas de trabajo',         sprint:1, activo:true  },
  { id:'comunicacion',  nombre:'Comunicación',              sprint:4, activo:false },
  { id:'presupuesto',   nombre:'Presupuesto',              sprint:4, activo:false },
  { id:'comite',        nombre:'Comité e informes',        sprint:4, activo:true  },
];

let moduloActual = 'nucleo';

async function iniciarSesion(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errorEl.textContent = 'Error de Supabase: ' + error.message; return; }
  mostrarApp(data.user);
}

async function cerrarSesion(){
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function mostrarApp(user){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('usuario-email').textContent = user?.email ?? '';
  renderSidebar();
  cargarModulo(moduloActual);
}

function renderSidebar(){
  const nav = document.getElementById('sidebar');
  nav.innerHTML = MODULOS.map(m => `
    <div class="modulo ${m.id === moduloActual ? 'activo' : ''}" onclick="cargarModulo('${m.id}')">
      ${m.nombre}
      ${!m.activo ? `<span class="badge-proximamente">Sprint ${m.sprint}</span>` : ''}
    </div>
  `).join('');
}

async function cargarModulo(id){
  moduloActual = id;
  renderSidebar();
  const main = document.getElementById('main-content');
  const modulo = MODULOS.find(m => m.id === id);

  if (!modulo.activo){
    main.innerHTML = `
      <h2>${modulo.nombre}</h2>
      <div class="placeholder-modulo">
        <strong>Módulo en construcción</strong>
        Este módulo llega en el Sprint ${modulo.sprint} del plan de trabajo.
      </div>`;
    return;
  }

  if (id === 'nucleo'){
    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
        <div>
          <h2>Objetivos e indicadores</h2>
          <p class="section-sub">Meta vs. valor real de cada objetivo específico</p>
        </div>
        <button class="btn-anadir" style="margin:0" onclick="abrirModalImportarCsv()">Actualizar desde CSV</button>
      </div>
      <div id="lista-objetivos"><p class="section-sub">Cargando...</p></div>`;
    await cargarObjetivosEIndicadores();
  }

  if (id === 'comite'){
    main.innerHTML = `
      <h2>Comité e informes</h2>
      <p class="section-sub">Comité Técnico-Científico Asesor: miembros, actas y seguimiento</p>
      <div class="tabs-comite">
        <button class="tab-comite activa" data-tab="miembros" onclick="cambiarTabComite('miembros')">Miembros</button>
        <button class="tab-comite" data-tab="actas" onclick="cambiarTabComite('actas')">Actas</button>
        <button class="tab-comite" data-tab="seguimiento" onclick="cambiarTabComite('seguimiento')">Seguimiento</button>
      </div>
      <div id="contenido-comite"><p class="section-sub">Cargando...</p></div>`;
    await cambiarTabComite('miembros');
  }

  if (id === 'cronograma'){
    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
        <div>
          <h2>Cronograma</h2>
          <p class="section-sub">Fechas previstas de actividades y acciones</p>
        </div>
        <div class="tabs-comite" style="margin:0; border-bottom:none;">
          <button class="tab-comite activa" data-vista="tabla" onclick="cambiarVistaCronograma('tabla')">Tabla</button>
          <button class="tab-comite" data-vista="gantt" onclick="cambiarVistaCronograma('gantt')">Gantt</button>
        </div>
      </div>
      <div id="contenido-cronograma"><p class="section-sub">Cargando...</p></div>`;
    await cambiarVistaCronograma('tabla');
  }

  if (id === 'actas'){
    main.innerHTML = `
      <h2>Actas de trabajo</h2>
      <p class="section-sub">Reuniones de coordinación interna del equipo AFEMPES</p>
      <div id="contenido-actas-trabajo"><p class="section-sub">Cargando...</p></div>`;
    await renderActasTrabajo();
  }
}

function abrirModalImportarCsv(){
  abrirModal('Actualizar indicadores desde CSV', `
    <p class="section-sub" style="margin-bottom:12px;">
      El archivo debe tener estas columnas (en este orden, con encabezado):<br>
      <code>objetivo_codigo,indicador_codigo,descripcion,unidad_medida,meta,valor_actual</code><br>
      Si el código del objetivo + indicador ya existe, se actualiza. Si no existe, se crea como
      indicador nuevo dentro de ese objetivo (el objetivo tiene que existir ya).
    </p>
    <button class="btn-secundario" onclick="descargarPlantillaCsv()">Descargar plantilla CSV</button>
    <div style="margin:14px 0;">
      <input type="file" id="csv-file-input" accept=".csv">
    </div>
    <button class="btn-primary btn-inline" onclick="procesarCsvIndicadores()">Importar</button>
    <div id="csv-resultado" class="section-sub" style="margin-top:12px; white-space:pre-line;"></div>
  `);
}

function descargarPlantillaCsv(){
  const contenido = "objetivo_codigo,indicador_codigo,descripcion,unidad_medida,meta,valor_actual\nOE1,1.1,Número de personas formadas y consolidadas en la brigada,personas,5,0\n";
  const blob = new Blob([contenido], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'plantilla_indicadores_turiaviu.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function procesarCsvIndicadores(){
  const input = document.getElementById('csv-file-input');
  const resultado = document.getElementById('csv-resultado');
  if (!input.files.length){ resultado.textContent = 'Selecciona un archivo CSV primero.'; return; }

  resultado.textContent = 'Procesando...';

  Papa.parse(input.files[0], {
    header: true,
    skipEmptyLines: true,
    complete: async (parsed) => {
      const filas = parsed.data;
      let creados = 0, actualizados = 0, errores = [];

      // Cache de objetivos por código para no consultar de más
      const { data: objetivos } = await sb.from('objetivos').select('id, codigo');
      const mapaObjetivos = {};
      (objetivos || []).forEach(o => mapaObjetivos[o.codigo.trim().toUpperCase()] = o.id);

      for (const [i, fila] of filas.entries()){
        const objCod = (fila.objetivo_codigo || '').trim().toUpperCase();
        const indCod = (fila.indicador_codigo || '').trim();
        if (!objCod || !indCod){ errores.push(`Fila ${i+2}: falta objetivo_codigo o indicador_codigo.`); continue; }

        const objetivoId = mapaObjetivos[objCod];
        if (!objetivoId){ errores.push(`Fila ${i+2}: objetivo "${fila.objetivo_codigo}" no existe, se ha omitido.`); continue; }

        const meta = fila.meta !== '' && fila.meta != null ? parseFloat(fila.meta) : null;
        const valorActual = fila.valor_actual !== '' && fila.valor_actual != null ? parseFloat(fila.valor_actual) : 0;

        const { data: existente } = await sb
          .from('indicadores')
          .select('id')
          .eq('objetivo_id', objetivoId)
          .eq('codigo', indCod)
          .maybeSingle();

        const { error } = await sb.from('indicadores').upsert({
          objetivo_id: objetivoId,
          codigo: indCod,
          descripcion: fila.descripcion || '',
          unidad_medida: fila.unidad_medida || null,
          meta,
          valor_actual: valorActual,
        }, { onConflict: 'objetivo_id,codigo' });

        if (error){ errores.push(`Fila ${i+2}: ${error.message}`); continue; }
        existente ? actualizados++ : creados++;
      }

      let resumen = `Importación completa: ${creados} indicador(es) nuevo(s), ${actualizados} actualizado(s).`;
      if (errores.length) resumen += `\n\nAvisos:\n` + errores.join('\n');
      resultado.textContent = resumen;
      await cargarObjetivosEIndicadores();
    },
    error: (err) => { resultado.textContent = 'Error al leer el CSV: ' + err.message; }
  });
}

async function cargarObjetivosEIndicadores(){
  const cont = document.getElementById('lista-objetivos');
  const { data: objetivos, error: errObj } = await sb
    .from('objetivos')
    .select('id, codigo, descripcion, indicadores(id, codigo, descripcion, unidad_medida, meta, valor_actual)')
    .order('codigo');

  if (errObj){
    cont.innerHTML = `<p class="section-sub">No se han podido cargar los objetivos. Comprueba la conexión con Supabase (URL/clave en la configuración) y las políticas RLS.</p>`;
    return;
  }
  if (!objetivos || objetivos.length === 0){
    cont.innerHTML = `<p class="section-sub">Todavía no hay objetivos cargados. Ejecuta el script schema_sprint1.sql y añade los OE1-OE5 del Marco Lógico.</p>`;
    return;
  }

  cont.innerHTML = objetivos.map(oe => `
    <div class="card objetivo-card">
      <span class="oe-codigo">${oe.codigo}</span>
      <p class="oe-desc">${oe.descripcion}</p>
      ${(oe.indicadores || []).map(ind => {
        const pct = ind.meta ? Math.min(100, Math.round((ind.valor_actual / ind.meta) * 100)) : 0;
        return `
        <div class="indicador-row">
          <div class="ind-label"><span>${ind.codigo} — ${ind.descripcion}</span><span>${ind.valor_actual} / ${ind.meta ?? '—'} ${ind.unidad_medida ?? ''}</span></div>
          <div class="barra-bg"><div class="barra-fill ${pct < 50 ? 'rosa' : ''}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

async function abrirModalSeguimiento(actividadId, accionId, etiqueta){
  const cuerpo = await construirCuerpoSeguimiento(actividadId, accionId);

async function construirCuerpoSeguimiento(actividadId, accionId){
  let query = sb.from('seguimiento_actividad')
    .select('*, indicadores(codigo, descripcion)')
    .eq('actividad_id', actividadId)
    .order('fecha', { ascending:false });
  query = accionId ? query.eq('accion_id', accionId) : query.is('accion_id', null);
  const { data: registros, error } = await query;

  const { data: indicadores } = await sb
    .from('indicadores')
    .select('id, codigo, descripcion, objetivos(codigo)')
    .order('codigo');

  const listaHtml = error
    ? `<p class="section-sub">Error al cargar: ${error.message}</p>`
    : (!registros || registros.length === 0)
      ? `<p class="section-sub">Todavía no hay registros de seguimiento.</p>`
      : registros.map(r => `
        <div class="registro-seguimiento" id="reg-${r.id}">
          <p class="section-sub" style="margin:0 0 2px;">${r.fecha}${r.indicadores ? ` · vinculado a ${r.indicadores.codigo}` : ''}</p>
          <p style="font-size:13px; margin:0 0 6px;">${r.descripcion}</p>
          <button class="btn-secundario btn-mini" onclick="mostrarFormConvertirIncidencia('${r.id}')">Convertir en incidencia</button>
          <div id="conv-${r.id}" class="form-convertir-incidencia" style="display:none;">
            <div class="form-grid" style="margin-top:8px;">
              <select id="conv-tipo-${r.id}">
                <option value="tecnica">Técnica</option>
                <option value="salud_seguridad">Salud/seguridad</option>
                <option value="administrativa_permisos">Administrativa/permisos</option>
                <option value="climatica">Climática</option>
                <option value="rrhh">RRHH</option>
                <option value="brigadista">Brigadista</option>
                <option value="otra">Otra</option>
              </select>
              <select id="conv-gravedad-${r.id}">
                <option value="1">Leve</option>
                <option value="2">Moderada</option>
                <option value="3">Grave</option>
              </select>
            </div>
            <button class="btn-primary btn-inline" onclick="confirmarConvertirIncidencia('${r.id}', '${actividadId}')">Crear incidencia</button>
          </div>
        </div>
      `).join('');

  return `
    <div class="card">
      <h3 class="titulo-card">Nuevo registro</h3>
      <textarea id="sg-descripcion" placeholder="¿Qué se ha hecho / qué ha pasado?" class="textarea-comite"></textarea>
      <div class="form-grid">
        <input id="sg-fecha" type="date" value="${new Date().toISOString().slice(0,10)}">
        <select id="sg-indicador">
          <option value="">Sin vincular a un indicador</option>
          ${(indicadores || []).map(i => `<option value="${i.id}">${i.objetivos?.codigo ?? ''} · ${i.codigo} — ${i.descripcion.slice(0,40)}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary btn-inline" onclick="crearSeguimiento('${actividadId}', ${accionId ? `'${accionId}'` : 'null'})">Guardar registro</button>
      <div id="seguimiento-msg" class="section-sub"></div>
    </div>
    <div id="lista-seguimiento">${listaHtml}</div>`;
}

async function crearSeguimiento(actividadId, accionId){
  const msg = document.getElementById('seguimiento-msg');
  const descripcion = document.getElementById('sg-descripcion').value.trim();
  if (!descripcion){ msg.textContent = 'Describe qué se ha hecho antes de guardar.'; return; }
  const { data: proyecto } = await sb.from('proyecto').select('id').limit(1).single();

  const { error } = await sb.from('seguimiento_actividad').insert({
    proyecto_id: proyecto.id,
    actividad_id: actividadId,
    accion_id: accionId,
    fecha: document.getElementById('sg-fecha').value,
    descripcion,
    indicador_id: document.getElementById('sg-indicador').value || null,
  });
  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }

  const cuerpo = await construirCuerpoSeguimiento(actividadId, accionId);
  document.getElementById('modal-cuerpo').innerHTML = cuerpo;
}

function mostrarFormConvertirIncidencia(registroId){
  const div = document.getElementById('conv-' + registroId);
  div.style.display = div.style.display === 'none' ? 'block' : 'none';
}

async function confirmarConvertirIncidencia(registroId, actividadId){
  const { data: registro } = await sb.from('seguimiento_actividad').select('descripcion, indicador_id').eq('id', registroId).single();
  const { data: proyecto } = await sb.from('proyecto').select('id').limit(1).single();
  const tipo = document.getElementById('conv-tipo-' + registroId).value;
  const gravedad = document.getElementById('conv-gravedad-' + registroId).value;

  const { error } = await sb.from('incidencias').insert({
    proyecto_id: proyecto.id,
    tipo,
    gravedad,
    descripcion: registro.descripcion,
    actividad_id: actividadId,
    indicador_id: registro.indicador_id,
  });

  const contenedor = document.getElementById('conv-' + registroId);
  if (error){
    contenedor.innerHTML = `<p class="section-sub" style="color:var(--rosa-dark)">Error: ${error.message}</p>`;
  } else {
    contenedor.innerHTML = `<p class="section-sub" style="color:var(--verde-bosque)">Incidencia creada correctamente.</p>`;
  }
}

      `).join('') || '<span class="section-sub">Añade miembros primero en la pestaña Miembros.</span>'}
    </div>
    <p class="section-sub" style="margin:10px 0 4px;">Se crea en estado "Convocada". Cuando se celebre la reunión, usa "Marcar como celebrada" para añadir los acuerdos.</p>
    <button class="btn-primary btn-inline" onclick="crearActaComite()">Guardar convocatoria</button>
    <div id="acta-msg" class="section-sub"></div>
  `);
}

async function crearActaComite(){
  const msg = document.getElementById('acta-msg');
  const { data: proyecto } = await sb.from('proyecto').select('id').limit(1).single();
  const asistentesIds = Array.from(document.querySelectorAll('.chk-asistente-nueva:checked')).map(c => c.value);

  const { data: acta, error } = await sb.from('actas_comite').insert({
    proyecto_id: proyecto.id,
    fecha: document.getElementById('na-fecha').value,
    hora: document.getElementById('na-hora').value || null,
    lugar: document.getElementById('na-lugar').value.trim() || null,
    tipo: document.getElementById('na-tipo').value,
    orden_dia: document.getElementById('na-orden').value.trim() || null,
    documento_url: document.getElementById('na-documento').value.trim() || null,
    fecha_envio_convocatoria: document.getElementById('na-fecha-envio').value || null,
    estado_convocatoria: 'convocada',
  }).select().single();

  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }

  if (asistentesIds.length > 0){
    const filas = asistentesIds.map(mid => ({ acta_id: acta.id, miembro_id: mid }));
    await sb.from('acta_comite_asistentes').insert(filas);
  }

  cerrarModal();
  await renderActasComite(document.getElementById('contenido-comite'));
}

function abrirModalCelebrarActa(actaId){
  abrirModal('Marcar reunión como celebrada', `
    <textarea id="ca-acuerdos" placeholder="Acuerdos tomados en la reunión" class="textarea-comite"></textarea>
    <input id="ca-documento" placeholder="Enlace al documento firmado (opcional)">
    <button class="btn-primary btn-inline" style="margin-top:10px;" onclick="guardarCelebrarActa('${actaId}')">Guardar</button>
    <div id="celebrar-msg" class="section-sub"></div>
  `);
}

async function guardarCelebrarActa(actaId){
  const msg = document.getElementById('celebrar-msg');
  const { error } = await sb.from('actas_comite').update({
    estado_convocatoria: 'celebrada',
    acuerdos: document.getElementById('ca-acuerdos').value.trim() || null,
    documento_url: document.getElementById('ca-documento').value.trim() || null,
  }).eq('id', actaId);
  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }
  cerrarModal();
  await renderActasComite(document.getElementById('contenido-comite'));
}

// --------- SEGUIMIENTO (compromisos del comité) ---------
async function renderSeguimientoComite(cont){
  const { data: compromisos, error } = await sb
    .from('compromisos_comite')
    .select('*, actas_comite(fecha, tipo), comite_miembros(nombre)')
    .order('fecha_limite', { ascending:true, nullsFirst:false });

  if (error){ cont.innerHTML = `<p class="section-sub">No se han podido cargar los compromisos: ${error.message}</p>`; return; }

  cont.innerHTML = `
    <button class="btn-anadir" onclick="abrirModalCompromiso()">+ Nuevo compromiso</button>
    <div>
      ${(!compromisos || compromisos.length === 0) ? '<p class="section-sub">Todavía no hay compromisos registrados.</p>' : compromisos.map(c => `
        <div class="card fila-miembro">
          <div>
            <p style="font-size:13px; margin:0 0 4px;">${c.descripcion}</p>
            <p class="section-sub" style="margin:0;">Responsable: ${c.comite_miembros?.nombre ?? c.responsable_nombre ?? '—'} · Límite: ${c.fecha_limite ?? '—'}</p>
            <p class="section-sub" style="margin:0;">Acta: ${c.actas_comite ? c.actas_comite.fecha + ' · ' + c.actas_comite.tipo.replace('_',' ') : '—'}</p>
          </div>
          <div>
            <select onchange="cambiarEstadoCompromiso('${c.id}', this.value)" class="select-estado estado-${c.estado}">
              <option value="pendiente" ${c.estado==='pendiente'?'selected':''}>Pendiente</option>
              <option value="en_curso" ${c.estado==='en_curso'?'selected':''}>En curso</option>
              <option value="cerrado" ${c.estado==='cerrado'?'selected':''}>Cerrado</option>
            </select>
          </div>
        </div>
      `).join('')}
    </div>`;
}

async function abrirModalCompromiso(){
  const { data: actas } = await sb.from('actas_comite').select('id, fecha, tipo').order('fecha', { ascending:false });
  const { data: miembros } = await sb.from('comite_miembros').select('id, nombre').eq('activo', true);
  abrirModal('Nuevo compromiso de seguimiento', `
    <div class="form-grid">
      <select id="ns-acta">
        ${(actas || []).map(a => `<option value="${a.id}">${a.fecha} · ${a.tipo.replace('_',' ')}</option>`).join('') || '<option value="">Crea un acta primero</option>'}
      </select>
      <select id="ns-responsable">
        <option value="">Responsable externo (escribir abajo)</option>
        ${(miembros || []).map(m => `<option value="${m.id}">${m.nombre}</option>`).join('')}
      </select>
      <input id="ns-responsable-nombre" placeholder="Nombre del responsable (si no está en la lista)">
      <input id="ns-fecha-limite" type="date">
    </div>
    <textarea id="ns-descripcion" placeholder="Descripción del compromiso" class="textarea-comite"></textarea>
    <button class="btn-primary btn-inline" onclick="crearCompromisoComite()">Guardar</button>
    <div id="compromiso-msg" class="section-sub"></div>
  `);
}

async function crearCompromisoComite(){
  const msg = document.getElementById('compromiso-msg');
  const actaId = document.getElementById('ns-acta').value;
  const descripcion = document.getElementById('ns-descripcion').value.trim();
  if (!actaId || !descripcion){ msg.textContent = 'Selecciona un acta y describe el compromiso.'; return; }

  const { error } = await sb.from('compromisos_comite').insert({
    acta_id: actaId,
    descripcion,
    responsable_id: document.getElementById('ns-responsable').value || null,
    responsable_nombre: document.getElementById('ns-responsable-nombre').value.trim() || null,
    fecha_limite: document.getElementById('ns-fecha-limite').value || null,
  });
  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }
  cerrarModal();
  await renderSeguimientoComite(document.getElementById('contenido-comite'));
}

async function cambiarEstadoCompromiso(id, estado){
  await sb.from('compromisos_comite').update({ estado }).eq('id', id);
  await renderSeguimientoComite(document.getElementById('contenido-comite'));
}

// =====================================================================
// MÓDULO: CRONOGRAMA
// =====================================================================
let vistaCronogramaActual = 'tabla';

async function cambiarVistaCronograma(vista){
  vistaCronogramaActual = vista;
  document.querySelectorAll('[data-vista]').forEach(b => b.classList.toggle('activa', b.dataset.vista === vista));
  const cont = document.getElementById('contenido-cronograma');
  cont.innerHTML = '<p class="section-sub">Cargando...</p>';
  const { data: actividades, error } = await sb
    .from('actividades')
    .select('id, codigo, nombre, fecha_inicio_prevista, fecha_fin_prevista, estado, acciones(id, codigo, descripcion, fecha_inicio_prevista, fecha_fin_prevista, estado)')
    .order('codigo');
  if (error){ cont.innerHTML = `<p class="section-sub">No se ha podido cargar el cronograma: ${error.message}</p>`; return; }

  if (vista === 'tabla') renderCronogramaTabla(cont, actividades);
  else await renderCronogramaGantt(cont, actividades);
}

function badgeEstado(estado){
  const etiquetas = { planificada:'Planificada', en_curso:'En curso', completada:'Completada', retrasada:'Retrasada' };
  return `<span class="select-estado estado-${estado === 'completada' ? 'cerrado' : estado === 'en_curso' ? 'en_curso' : 'pendiente'}">${etiquetas[estado] || estado}</span>`;
}

function renderCronogramaTabla(cont, actividades){
  if (!actividades || actividades.length === 0){
    cont.innerHTML = `<p class="section-sub">Todavía no hay actividades cargadas. Ejecuta <code>select cargar_seed_nucleo();</code> en el SQL Editor de Supabase para cargarlas desde el Excel.</p>`;
    return;
  }
  cont.innerHTML = actividades.map(a => `
    <div class="card">
      <div class="fila-miembro">
        <div>
          <span class="oe-codigo">${a.codigo}</span> <strong style="font-size:13px;">${a.nombre}</strong>
          <p class="section-sub" style="margin:4px 0 0;">
            ${a.fecha_inicio_prevista ?? '— sin fecha —'} → ${a.fecha_fin_prevista ?? '— sin fecha —'}
          </p>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          ${badgeEstado(a.estado)}
          <button class="btn-secundario" onclick="abrirModalSeguimiento('${a.id}', null, '${a.codigo}: ${a.nombre.replace(/'/g,"\\'")}')">Seguimiento</button>
          <button class="btn-secundario" onclick="abrirModalFechas('actividad','${a.id}','${a.codigo}: ${a.nombre.replace(/'/g,"\\'")}','${a.fecha_inicio_prevista ?? ''}','${a.fecha_fin_prevista ?? ''}','${a.estado}')">Editar fechas</button>
        </div>
      </div>
      ${(a.acciones || []).length > 0 ? `
        <div class="lista-acciones-cronograma">
          ${a.acciones.map(acc => `
            <div class="fila-accion-cronograma">
              <div>
                <span class="oe-codigo" style="background:var(--fondo)">${acc.codigo}</span>
                <span style="font-size:12.5px;">${acc.descripcion}</span>
                <p class="section-sub" style="margin:2px 0 0;">${acc.fecha_inicio_prevista ?? '— sin fecha —'} → ${acc.fecha_fin_prevista ?? '— sin fecha —'}</p>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                ${badgeEstado(acc.estado)}
                <button class="btn-secundario" onclick="abrirModalSeguimiento('${a.id}', '${acc.id}', '${acc.codigo}: ${acc.descripcion.replace(/'/g,"\\'").slice(0,60)}')">Seguimiento</button>
                <button class="btn-secundario" onclick="abrirModalFechas('accion','${acc.id}','${acc.codigo}: ${acc.descripcion.replace(/'/g,"\\'").slice(0,60)}','${acc.fecha_inicio_prevista ?? ''}','${acc.fecha_fin_prevista ?? ''}','${acc.estado}')">Editar</button>
              </div>
            </div>
          `).join('')}
        </div>` : ''}
    </div>
  `).join('');
}

function abrirModalFechas(tipo, id, etiqueta, fechaInicio, fechaFin, estado){
  abrirModal(`Fechas — ${etiqueta}`, `
    <div class="form-grid">
      <div>
        <label class="section-sub" style="display:block; margin-bottom:4px;">Fecha de inicio</label>
        <input id="cr-fecha-inicio" type="date" value="${fechaInicio}">
      </div>
      <div>
        <label class="section-sub" style="display:block; margin-bottom:4px;">Fecha de fin</label>
        <input id="cr-fecha-fin" type="date" value="${fechaFin}">
      </div>
      <select id="cr-estado">
        <option value="planificada" ${estado==='planificada'?'selected':''}>Planificada</option>
        <option value="en_curso" ${estado==='en_curso'?'selected':''}>En curso</option>
        <option value="completada" ${estado==='completada'?'selected':''}>Completada</option>
        <option value="retrasada" ${estado==='retrasada'?'selected':''}>Retrasada</option>
      </select>
    </div>
    <button class="btn-primary btn-inline" onclick="guardarFechas('${tipo}','${id}')">Guardar</button>
    <div id="cronograma-msg" class="section-sub"></div>
  `);
}

async function guardarFechas(tipo, id){
  const msg = document.getElementById('cronograma-msg');
  const tabla = tipo === 'actividad' ? 'actividades' : 'acciones';
  const { error } = await sb.from(tabla).update({
    fecha_inicio_prevista: document.getElementById('cr-fecha-inicio').value || null,
    fecha_fin_prevista: document.getElementById('cr-fecha-fin').value || null,
    estado: document.getElementById('cr-estado').value,
  }).eq('id', id);
  if (error){ msg.textContent = 'Error al guardar: ' + error.message; return; }
  cerrarModal();
  await cambiarVistaCronograma(vistaCronogramaActual);
}

// --------- VISTA GANTT ---------
async function renderCronogramaGantt(cont, actividades){
  const { data: proyecto } = await sb.from('proyecto').select('fecha_inicio, fecha_fin').limit(1).single();
  const inicio = new Date(proyecto.fecha_inicio);
  const fin = new Date(proyecto.fecha_fin);
  const meses = [];
  let cursor = new Date(inicio.getFullYear(), inicio.getMonth(), 1);
  while (cursor <= fin){
    meses.push(new Date(cursor));
    cursor.setMonth(cursor.getMonth() + 1);
  }
  const nombresMes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const totalCols = meses.length;

  function offsetYSpan(fIni, fFin){
    if (!fIni || !fFin) return null;
    const di = new Date(fIni), df = new Date(fFin);
    const colIni = (di.getFullYear() - inicio.getFullYear()) * 12 + (di.getMonth() - inicio.getMonth());
    const colFin = (df.getFullYear() - inicio.getFullYear()) * 12 + (df.getMonth() - inicio.getMonth());
    return { offset: Math.max(0, colIni), span: Math.max(1, colFin - colIni + 1) };
  }

  const colorEstado = { planificada:'var(--salvia)', en_curso:'var(--rosa)', completada:'var(--verde-bosque)', retrasada:'var(--rosa-dark)' };

  let filas = '';
  actividades.forEach(a => {
    const pos = offsetYSpan(a.fecha_inicio_prevista, a.fecha_fin_prevista);
    filas += `
      <div class="gantt-fila">
        <div class="gantt-etiqueta"><strong>${a.codigo}</strong> ${a.nombre.slice(0,40)}${a.nombre.length>40?'…':''}</div>
        <div class="gantt-pista" style="grid-template-columns: repeat(${totalCols}, 1fr);">
          ${pos ? `<div class="gantt-barra" style="grid-column: ${pos.offset+1} / span ${pos.span}; background:${colorEstado[a.estado]};" title="${a.fecha_inicio_prevista} → ${a.fecha_fin_prevista}"></div>` : ''}
        </div>
      </div>`;
    (a.acciones || []).forEach(acc => {
      const posAcc = offsetYSpan(acc.fecha_inicio_prevista, acc.fecha_fin_prevista);
      filas += `
        <div class="gantt-fila gantt-fila-accion">
          <div class="gantt-etiqueta">　${acc.codigo} ${acc.descripcion.slice(0,32)}${acc.descripcion.length>32?'…':''}</div>
          <div class="gantt-pista" style="grid-template-columns: repeat(${totalCols}, 1fr);">
            ${posAcc ? `<div class="gantt-barra gantt-barra-fina" style="grid-column: ${posAcc.offset+1} / span ${posAcc.span}; background:${colorEstado[acc.estado]};" title="${acc.fecha_inicio_prevista} → ${acc.fecha_fin_prevista}"></div>` : ''}
          </div>
        </div>`;
    });
  });

  cont.innerHTML = `
    <div class="gantt-leyenda">
      <span><i style="background:var(--salvia)"></i> Planificada</span>
      <span><i style="background:var(--rosa)"></i> En curso</span>
      <span><i style="background:var(--verde-bosque)"></i> Completada</span>
      <span><i style="background:var(--rosa-dark)"></i> Retrasada</span>
    </div>
    <div class="gantt-scroll">
      <div class="gantt-fila gantt-cabecera">
        <div class="gantt-etiqueta"></div>
        <div class="gantt-pista" style="grid-template-columns: repeat(${totalCols}, 1fr);">
          ${meses.map(m => `<div class="gantt-mes">${nombresMes[m.getMonth()]} ${String(m.getFullYear()).slice(2)}</div>`).join('')}
        </div>
      </div>
      ${filas || '<p class="section-sub">No hay actividades cargadas.</p>'}
    </div>`;
}
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) mostrarApp(session.user);
})();
</script>
